services:
  # ---------- INFRASTRUCTURE ----------
  postgres:
    image: postgres:16
    container_name: quickbite-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: quickbite-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ---------- API GATEWAY (KONG) ----------
  kong-database:
    image: postgres:16
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.7
    container_name: kong-migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure

  kong:
    image: kong:3.7
    container_name: quickbite-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully

  # ---------- YOUR SERVICES ----------
  auth-service:
    image: quickbite-auth-service
    container_name: auth-service
    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/quickbite_auth"
      PORT: 3001
      JWT_SECRET: "quickbite-super-secret-jwt-key-change-in-production"
    depends_on:
      postgres:
        condition: service_healthy

  restaurant-service:
    image: quickbite-restaurant-service
    container_name: restaurant-service
    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/quickbite_restaurants"
      PORT: 3002
      JWT_SECRET: "quickbite-super-secret-jwt-key-change-in-production"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    image: quickbite-order-service
    container_name: order-service
    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/quickbite_orders"
      PORT: 3003
      JWT_SECRET: "quickbite-super-secret-jwt-key-change-in-production"
      RESTAURANT_SERVICE_URL: "http://restaurant-service:3002"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_CLIENT_ID: "order-service"
    depends_on:
      postgres:
        condition: service_healthy

  delivery-service:
    image: quickbite-delivery-service
    container_name: delivery-service
    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/quickbite_delivery"
      PORT: 3004
      JWT_SECRET: "quickbite-super-secret-jwt-key-change-in-production"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    image: quickbite-notification-service
    container_name: notification-service
    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/quickbite_notifications"
      PORT: 3005
      JWT_SECRET: "quickbite-super-secret-jwt-key-change-in-production"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_CLIENT_ID: "notification-service"
      KAFKA_GROUP_ID: "notification-group"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
  kong-db-data:
